services:
  # ==========================================
  # 1. qBittorrent
  # ==========================================
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    cpus: '0.1'
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Moscow
      - WEBUI_PORT=8082
    volumes:
      - ./qbittorrent-config:/config
      - /mnt/torrents:/downloads
      - ./hook.sh:/hook.sh:ro
      - ./bot-config.yml:/bot-config.yml:ro
      - ./queue:/queue
    ports:
      - "8082:8082"
      - "6881:6881"
      - "6881:6881/udp"
    networks:
      - cloud-net

  # ==========================================
  # 2. Telegram-бот
  # ==========================================
  qb-tg-bot:
    image: ch3p4ll3/qbittorrent-bot:latest
    container_name: qb-tg-bot
    restart: unless-stopped
    cpus: '0.1'
    volumes:
      - ./bot-config.yml:/app/data/config.yml
    depends_on:
      - qbittorrent
    networks:
      - cloud-net
  # ==========================================
  # 3. nginx
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: torrent-nginx
    restart: unless-stopped
    cpus: '0.1'
    ports:
      - "8080:80"
    volumes:
      - /mnt/torrents:/data:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    networks:
      - cloud-net
  # ==========================================
  # 4. worker
  # ==========================================
  worker:
    build: ./worker
    container_name: torrent-worker
    restart: unless-stopped
    cpus: '0.7'
    mem_limit: 2g
    memswap_limit: 2g
    env_file:
      - .env
    volumes:
      - /mnt/torrents:/downloads
      - ./queue:/queue
      - ./bot-config.yml:/bot-config.yml:ro
    networks:
      - cloud-net

networks:
  cloud-net:
    driver: bridge

volumes:
  nextcloud-data:
