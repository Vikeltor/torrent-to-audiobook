server {
    listen 80;
    server_name _;

    charset utf-8;
    root /data;
    autoindex off;

    # Секретный путь — файлы доступны только тут
    location /x7k9m2p4q8w3d5n6/ {
        alias /data/;
        add_header Content-Disposition "attachment";
        try_files $uri =404;
    }

    # Всё остальное — 404
    location / {
        return 404;
    }
}
